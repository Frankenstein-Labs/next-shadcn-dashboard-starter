services:
  - type: web
    name: aetheris-searxng
    runtime: docker
    repo: https://github.com/Frankenstein-Labs/next-shadcn-dashboard-starter.git
    branch: main
    dockerfilePath: ./infra/searxng/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    autoDeploy: yes
    envVars:
      - key: SEARXNG_BIND_ADDRESS
        value: 0.0.0.0
      - key: SEARXNG_PORT
        value: 10000
      - key: SEARXNG_SECRET
        sync: false
      - key: SEARXNG_BASE_URL
        value: https://aetheris-searxng.onrender.com
